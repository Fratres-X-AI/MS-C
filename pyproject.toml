[project]
name = "ms-c"
version = "0.1.0"
description = "MS-C Mantle — site-deployable VIS/IR adversarial camouflage digital prototype (Fratres X AI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fratres X AI" }]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "mypy>=1.8",
]
demo = [
  "gradio>=4.0",
]
yolo = [
  "ultralytics>=8.0",
  "torch>=2.0",
]

[project.scripts]
msc-reproduce = "sim.reproduce:main"
msc-optimize = "sim.run_optimize:main"
msc-demo = "demo.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*", "models*", "demo*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["sim", "models", "analysis", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_unused_configs = true
ignore_missing_imports = true
files = [
  "models",
  "sim",
  "demo",
]
